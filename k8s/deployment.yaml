apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-platform
  labels:
    app: cloudops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-platform

  template:
    metadata:
      labels:
        app: cloudops-platform

    spec:
      containers:
        - name: cloudops-platform
          image: 979214968440.dkr.ecr.ap-south-1.amazonaws.com/cloudops-platform:6.0

          ports:
            - containerPort: 4000

          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: PUBLIC_BASE_URL
              value: "http://abebc91f6a0c94e23b9714b5b202cfdf-1455164344.ap-south-1.elb.amazonaws.com:4000"
            - name: GOOGLE_CALLBACK_URL
              value: "http://abebc91f6a0c94e23b9714b5b202cfdf-1455164344.ap-south-1.elb.amazonaws.com:4000/api/auth/google/callback"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: MONGODB_URI
                  optional: true
            - name: MONGODB_DB_NAME
              value: "cloudops"
            - name: MAX_UPLOAD_SIZE_MB
              value: "1024"
            - name: SESSION_TTL_DAYS
              value: "3"

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
